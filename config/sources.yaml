# ---------------------------------------------------------------------------
# Substack publications
# ---------------------------------------------------------------------------
# Uses Substack's internal JSON API (https://<slug>.substack.com/api/v1/archive)
# as the primary fetch method — less likely to be blocked by Cloudflare than RSS.
# Automatically falls back to the RSS feed only when the JSON API returns a
# non-retriable 4xx (permanent HTTP) error.
substack:
  enabled: true

  publications:
    - name: "Nate's Newsletter"
      slug: "natesnewsletter"

# ---------------------------------------------------------------------------
# Blog / RSS feeds
# ---------------------------------------------------------------------------
blogs:
  enabled: true

  rss:
    # Primary focus: Nate's Newsletter — AI strategy and implementation analysis.
    # Activated once the RSS fetcher (Epic 4.1–4.4) is implemented.
    #
    # Note: Substack newsletters are now fetched via the `substack` section above,
    # which uses the JSON API and is less likely to be blocked by Cloudflare.
    # - name: "Nate's Newsletter"
    #   url: "https://natesnewsletter.substack.com/feed"

    # Paused while focusing on Nate Jones content:
