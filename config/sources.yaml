    enabled: true

  # ── Singleton fetchers — one entry per fetcher ────────────────────────────

  - type: hackernews
    name: "Hacker News"
    source_class: practitioner
    enabled: true
    min_score: 100
    max_stories: 5
    keywords:
      - "LLM"
      - "large language model"
      - "Claude"
      - "GPT"
      - "Gemini"
      - "Llama"
      - "AI agent"
      - "transformer"
