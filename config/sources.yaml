# Latest Developments — Source Configuration
#
# Edit this file to control which sources are monitored and how the digest is generated.
# See README.md for full documentation.
#
# Environment variables (set as GitHub Secrets):
#   Required for all providers:
#     EMAIL_SENDER      — From address
#     EMAIL_RECIPIENT   — Destination address
#     EMAIL_PROVIDER    — "gmail" | "sendgrid" | "resend" (default: gmail)
#
#   Gmail (EMAIL_PROVIDER=gmail):
#     EMAIL_PASSWORD    — Gmail App Password (requires 2FA)
#
#   SendGrid (EMAIL_PROVIDER=sendgrid):
#     EMAIL_PASSWORD    — SendGrid API key
#
#   Resend (EMAIL_PROVIDER=resend) — free tier, no App Password required:
#     RESEND_API_KEY    — Resend API key (resend.com, 3 000 emails/month free)
#
#   Required for YouTube fetcher:
#     YOUTUBE_API_KEY   — YouTube Data API v3 key (Google Console, free tier — 10 000 units/day)
#                         Get a key at https://console.developers.google.com/
#                         Enable the "YouTube Data API v3" for the project.
#
#   Required only when summary.enabled is true:
#     GEMINI_API_KEY    — Google AI Studio API key (free at aistudio.google.com)

# ---------------------------------------------------------------------------
# YouTube channels
# ---------------------------------------------------------------------------
youtube:
  enabled: true

  # How many recent videos to check per channel (most recent first)
  max_videos_per_channel: 5

  # Token budget note: each video contributes up to 12,000 chars of content.
  # With multiple active channels, total input to Gemini can grow quickly.
  # As a rough guide: (active channels) × max_videos_per_channel × ~3,000 chars ≈ input tokens.
  # Use per-channel `max_videos: N` to cap a specific channel's contribution.
  # Enable channels incrementally and monitor Gemini usage in AI Studio.

  channels:
    # Primary focus: Nate Jones — AI practitioner and strategist.
    # Channel: https://youtube.com/@natebjones
    - name: "Nate Jones"
      channel_id: "UC0C-17n9iuUQPylguM1d-lQ"

    # --- News Junkies (daily coverage) ---

    # Wes Roth — closest competitor to Nate Jones for daily frequency.
    # Covers OpenAI, Anthropic, open-source breakthroughs; pro-AGI strategic focus.
    # Channel: https://youtube.com/@WesRoth
    # max_videos: 3 limits token usage during initial ramp-up; increase when comfortable.
    - name: "Wes Roth"
      channel_id: "UCqcbQf6yw5KzRoDDcZ_wBSw"
      max_videos: 3

    # Matthew Berman — go-to for open-source AI and live model testing.
    # Shows how to run bleeding-edge models on local hardware.
    # Channel: https://youtube.com/@matthew_berman
    # - name: "Matthew Berman"
    #   channel_id: "UCawZsQWqfGSbCI5yjkdVkTA"
    #   max_videos: 3

    # The AI Daily Brief (Nathaniel Whittemore) — professional "briefing" style.
    # Daily podcast/video synthesising macro-trends, politics, and funding behind AI.
    # Channel: https://youtube.com/@AIDailyBrief
    # - name: "The AI Daily Brief"
