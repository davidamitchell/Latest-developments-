# ---------------------------------------------------------------------------
# Hacker News
# ---------------------------------------------------------------------------
hacker_news:
  enabled: true

  # Only include stories with at least this many points
  min_score: 100

  # Only include stories matching at least one of these keywords (case-insensitive)
  # Applied to title + URL
  keywords:
    - "LLM"
    - "large language model"
    - "Claude"
    - "GPT"
    - "Gemini"
    - "Llama"
    - "AI agent"
    - "transformer"
    - "RAG"
    - "fine-tuning"
    - "inference"
    - "benchmark"
    - "Anthropic"
    - "OpenAI"
    - "DeepMind"
    - "Mistral"

  # Maximum stories to include in the digest
  max_stories: 10

# ---------------------------------------------------------------------------
# Summarisation settings
# ---------------------------------------------------------------------------
summary:
  # Set to false to skip Claude and produce a plain link list instead.
  # Useful for testing email delivery without an Anthropic API key.
  enabled: true

  # Gemini model to use. Get a free API key at aistudio.google.com.
  # Free tier requires no billing — create key at aistudio.google.com,
  # do not link a billing account, and use a free-eligible model.
  #
  # Free-tier eligible models (as of Feb 2026):
  #   gemini-2.5-flash   — latest, free tier (recommended)
  #   gemini-2.0-flash   — previous generation, also free tier
  #   gemini-2.0-flash-lite — lighter, higher rate limits
  model: "gemini-2.5-flash"

  # Maximum output tokens for the full digest
  max_tokens: 3000

  # Maximum items to include per source in the digest
  max_items_per_source: 5

  # System prompt passed to Gemini.
  # Describe what you consider "important" for your digest.
  # The pipeline will append source content after this prompt.
  prompt: |
    You are summarising content from AI/ML sources for a senior software engineer
    who follows the LLM space closely. Be concise and technical.

    For each item, write:
    Theme: [1–3 word label, e.g. "agentic RAG", "fine-tuning", "inference cost"]
    Summary: [2–3 sentences: what it is, why it matters, one concrete takeaway]

    Focus on:
    - New model releases and their key capabilities or benchmarks
    - Novel research techniques with practical implications
    - Important open-source releases (libraries, tools, datasets)
    - Significant industry news (funding, partnerships, policy)
    - Practical developer tutorials or insights worth knowing

    Skip:
    - Pure marketing announcements with no technical substance
    - Repetitive coverage of the same story
    - Beginner-level tutorials unless the technique is genuinely new

    After all items, add a ## Suggested Sources section with 2–3 YouTube channels,
    newsletters, or blogs that complement today's content themes and that the reader
    is unlikely to already follow. Write each source name in bold and add one sentence
    explaining why it is worth following.

    Then add a ## TL;DR section: exactly 3 bullet points (no more), each a single
    concise sentence naming the most impactful item and why it matters.
    Follow with one "Recurring theme: …" line.

    Finally, add a ## Item Themes section listing each item's URL and its theme label,
    one per line, in exactly this format:
    - <url> | <theme label>

    Also add a ## Item Summaries section listing each item's URL and a one-to-two
    sentence summary, one per line, in exactly this format:
    - <url> | <summary>

    Use the exact URL from the 'URL:' field provided for each item.

# ---------------------------------------------------------------------------
# History & Trend Analysis (Epic 8)
# ---------------------------------------------------------------------------
history:
  # Set to false to disable digest archiving and trend context entirely.
  enabled: true

  # Number of past daily digests to pass to Gemini as trend context.
  # Increasing this gives richer comparisons but uses more tokens.
  history_days: 7

  # Directory (relative to project root) where archived digests are stored.
  # Each successful send writes history/<YYYY-MM-DD>.txt.
  # This directory is committed to the repo by the workflow after each run.
  history_dir: "history"

# ---------------------------------------------------------------------------
# Email settings (credentials come from environment variables / GitHub Secrets)
# ---------------------------------------------------------------------------
email:
  # Subject line for the daily digest email
  subject: "Daily AI Digest — {date}"

  # Send even if there are no new items (sends a "nothing new today" note)
  send_if_empty: false

# ---------------------------------------------------------------------------
# Scheduling (informational — actual schedule is in .github/workflows/daily-digest.yml)
# ---------------------------------------------------------------------------
schedule:
  # UTC time for the daily run. Update the cron in the workflow file to match.
  time_utc: "07:00"
  timezone_note: "Adjust .github/workflows/daily-digest.yml cron to match your preferred time"

# ---------------------------------------------------------------------------
# Debug / logging
# ---------------------------------------------------------------------------
logging:
  # "INFO" for normal runs, "DEBUG" for verbose output
  # Override with --debug flag at runtime
  level: "INFO"

  # Write logs to a file in addition to stdout (useful in Codespaces)
  # Set to null to disable file logging
  log_file: null  # e.g. "logs/digest.log"

# ---------------------------------------------------------------------------
# Trend analysis sources (trends pipeline only — NOT used by email digest)
# ---------------------------------------------------------------------------
trends:
  enabled: true

  # arXiv RSS — free, no API key. Source class: primary.
  arxiv:
    enabled: true
    categories:
      - cs.AI    # Artificial Intelligence
      - cs.LG    # Machine Learning
      - cs.CL    # Computation and Language (NLP)
      - cs.CV    # Computer Vision
      - cs.RO    # Robotics
    max_papers: 30  # per category per run

  # Future sources (add enabled: true when ready):
  # huggingface:
  #   enabled: false
  #   max_models: 50
  #
  # paperswithcode:
  #   enabled: false
  #   max_papers: 20
  #
  # operator_sources:
  #   enabled: false
  #   feeds:
  #     - name: "OpenAI Changelog"
  #       url: "https://platform.openai.com/docs/changelog"
  #       source_class: "operator"
  #     - name: "Anthropic News"
  #       url: "https://www.anthropic.com/news"
  #       source_class: "operator"

  # Hugging Face model releases — primary class.
  # Enable once arXiv is confirmed stable.
  huggingface:
    enabled: false      # set to true to activate
    max_models: 50
    min_downloads: 100  # filter out low-activity models

  # Papers with Code — primary class; has_code=True → reproducibility=1.0.
  # Fetches trending papers with linked code repositories.
  # API: https://paperswithcode.com/api/v1/papers/?ordering=-stars
  paperswithcode:
    enabled: false
    page_size: 20
    min_stars: 0        # minimum GitHub stars on linked repos

  # Operator changelogs — operator class.
  # RSS feeds from major AI lab / operator blogs.
  operator_sources:
    enabled: false
    feeds:
      - "https://www.anthropic.com/rss.xml"
      - "https://openai.com/blog/rss.xml"
      - "https://blog.google/technology/ai/rss/"
      - "https://deepmind.google/blog/rss.xml"
      - "https://aws.amazon.com/blogs/machine-learning/feed/"
      - "https://blogs.microsoft.com/ai/feed/"

  # Replicate public models — operator class.
  # Reflects real deployment / run-count activity.
  # API: https://api.replicate.com/v1/models?order=run_count (no auth)
  replicate:
    enabled: false
    limit: 20

  # OpenReview accepted papers — primary class; evidence_type=experiment.
  # Peer-reviewed top-venue acceptance = highest-quality primary signal.
  # API: https://api2.openreview.net/notes
  openreview:
    enabled: false
    limit: 25
    venues:
      - "ICLR.cc/2025/Conference/-/Accepted"
      - "NeurIPS.cc/2025/Conference/-/Accepted"
      - "ICML.cc/2025/Conference/-/Accepted"

    # ── Operator / Media RSS feeds for trends pipeline (W-0019) ──
    # These feeds are fetched by the trend analysis pipeline (src/trends.py),
    # NOT the email digest. They add operator-class signal for cross-class
    # confirmation. All URLs are confirmed RSS. Enable individually.
    #
    # operator_rss:
    #   enabled: false
    #   feeds:
    #     - name: "Anthropic Blog"
    #       url: "https://www.anthropic.com/rss.xml"
    #       source_class: "operator"
    #     - name: "OpenAI Blog"
    #       url: "https://openai.com/blog/rss.xml"
    #       source_class: "operator"
    #     - name: "Google AI Blog"
    #       url: "https://blog.google/technology/ai/rss/"
    #       source_class: "operator"
    #     - name: "DeepMind Blog"
    #       url: "https://deepmind.google/blog/rss.xml"
    #       source_class: "operator"
    #     - name: "AWS Machine Learning Blog"
    #       url: "https://aws.amazon.com/blogs/machine-learning/feed/"
    #       source_class: "operator"
    #     - name: "Microsoft AI Blog"
    #       url: "https://blogs.microsoft.com/ai/feed/"
    #       source_class: "operator"
    #     - name: "Ethan Mollick — One Useful Thing"
    #       url: "https://www.oneusefulthing.org/feed"
    #       source_class: "practitioner"
    #     - name: "HBR — AI & Machine Learning"
    #       url: "https://hbr.org/topic/subject/ai-and-machine-learning/feed"
    #       source_class: "media"
    #     - name: "MIT Sloan Management Review"
    #       url: "https://sloanreview.mit.edu/feed/"
    #       source_class: "media"

  # ── OpenRouter model pricing snapshots (W-0020) ──────────────────────────
  # Fetches the OpenRouter public model catalogue (no auth required).
  # Each model becomes a market-class item with evidence_type="pricing",
  # feeding the inference-cost trend signal.
  openrouter:
    enabled: false      # set to true to activate daily pricing snapshots
    limit: 100          # max models to snapshot per run

  # ── New entrant inference / token providers (W-0021) ─────────────────────
  # All feeds below are verified live (2026-05-01).
  # RSS blogs where available; GitHub releases.atom used as fallback for
  # providers whose blogs block scraping or don't expose RSS.
  new_entrant_sources:
    enabled: false
    feeds:
      # Together AI — open-model hosting; confirmed RSS 2026-05-01
      - "https://www.together.ai/blog/rss.xml"
      # Lambda (formerly Lambda Labs) — GPU cloud; confirmed RSS 2026-05-01
      - "https://lambda.ai/blog/rss.xml"
      # Groq — ultra-fast inference; GitHub SDK releases as proxy (blog has no RSS)
      - "https://github.com/groq/groq-python/releases.atom"
      # Cerebras — wafer-scale hardware; GitHub SDK releases as proxy
      - "https://github.com/Cerebras/cerebras-cloud-sdk-python/releases.atom"
      # Mistral AI — open-weight frontier models; GitHub releases (blog blocks RSS)
      - "https://github.com/mistralai/mistral-inference/releases.atom"
      - "https://github.com/mistralai/client-python/releases.atom"
      # Fireworks AI — no accessible RSS or public GitHub releases feed found
      # Perplexity — blog returns 403; no accessible feed found

  # ── Local model / self-hosted tools (W-0022) ─────────────────────────────
  # GitHub releases.atom feeds and practitioner blogs for local LLM tooling.
  # All GitHub releases feeds are confirmed reliable — no auth required.
  local_model_sources:
    enabled: false
    feeds:
      # Ollama — the de-facto local model runner
      - "https://github.com/ollama/ollama/releases.atom"
      # llama.cpp — foundational quantised inference library
      - "https://github.com/ggerganov/llama.cpp/releases.atom"
      # LocalAI — OpenAI-compatible local inference server
