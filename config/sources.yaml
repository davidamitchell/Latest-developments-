# Latest Developments — Source Configuration (ADR-0018)
#
# Two independent top-level sections:
#
#   sources:  flat list of fetch sources — read by src/pipeline/fetch.py
#   digest:   email digest settings     — read by src/digest/send.py
#
# Neither section references the other. Adding or removing a source never
# requires touching the digest section, and vice versa.
#
# Environment variables (set as GitHub Secrets):
#   EMAIL_SENDER, EMAIL_RECIPIENT, EMAIL_PROVIDER
#   EMAIL_PASSWORD or RESEND_API_KEY
#   YOUTUBE_API_KEY      — YouTube Data API v3
#   GEMINI_API_KEY       — Google AI Studio (free at aistudio.google.com)

# ---------------------------------------------------------------------------
# sources — flat list, one entry per source
#
# Every entry has these common fields:
#   type          rss | youtube | substack | hackernews | arxiv |
#                 huggingface | paperswithcode | operator_changelog |
#                 replicate | openreview | openrouter
#   name          human-readable label (also used as source_name on ProcessedItem)
#   source_class  primary | operator | practitioner | media | market
#   enabled       true | false  (default: true)
#
# Type-specific options follow inline (see per-type examples below).
# ---------------------------------------------------------------------------
