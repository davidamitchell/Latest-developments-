# Latest Developments — Source Configuration
#
# Edit this file to control which sources are monitored and how the digest is generated.
# See README.md for full documentation.
#
# Environment variables (set as GitHub Secrets):
#   Required for all providers:
#     EMAIL_SENDER      — From address
#     EMAIL_RECIPIENT   — Destination address
#     EMAIL_PROVIDER    — "gmail" | "sendgrid" | "resend" (default: gmail)
#
#   Gmail (EMAIL_PROVIDER=gmail):
#     EMAIL_PASSWORD    — Gmail App Password (requires 2FA)
#
#   SendGrid (EMAIL_PROVIDER=sendgrid):
#     EMAIL_PASSWORD    — SendGrid API key
#
#   Resend (EMAIL_PROVIDER=resend) — free tier, no App Password required:
#     RESEND_API_KEY    — Resend API key (resend.com, 3 000 emails/month free)
#
#   Required only when summary.enabled is true:
#     GEMINI_API_KEY    — Google AI Studio API key (free at aistudio.google.com)

# ---------------------------------------------------------------------------
# YouTube channels
# ---------------------------------------------------------------------------
youtube:
  enabled: true

  # How many recent videos to check per channel (most recent first)
  max_videos_per_channel: 5

  channels:
    # Primary focus: Nate Jones — AI practitioner and strategist.
    # Channel: https://youtube.com/@natebjones
    # TO ACTIVATE: replace CHANNEL_ID_NEEDED with the UC… channel ID.
    # Find it: open the channel page in a browser → view source → search "channelId"
    - name: "Nate Jones"
      channel_id: "UC0C-17n9iuUQPylguM1d-lQ"

    # Paused while focusing on Nate Jones content (backlog 1.6):
    # - name: "Andrej Karpathy"
    #   channel_id: "UCbXgNpp0jedKWcQiULLbDTA"
    # - name: "Yannic Kilcher"
    #   channel_id: "UCZHmQk67mSJgfCCTn7xBfew"
    # - name: "AI Explained"
    #   channel_id: "UCNJ1Ymd5yFuUPtn21xtRbbw"

# ---------------------------------------------------------------------------
# Substack publications
# ---------------------------------------------------------------------------
# Uses Substack's internal JSON API (https://<slug>.substack.com/api/v1/archive)
# as the primary fetch method — less likely to be blocked by Cloudflare than RSS.
# Automatically falls back to the RSS feed only when the JSON API returns a
# non-retriable 4xx (permanent HTTP) error.
substack:
  enabled: true

  publications:
    - name: "Nate's Newsletter"
      slug: "natesnewsletter"

# ---------------------------------------------------------------------------
# Blog / RSS feeds
# ---------------------------------------------------------------------------
blogs:
  enabled: true

  rss:
    # Primary focus: Nate's Newsletter — AI strategy and implementation analysis.
    # Activated once the RSS fetcher (Epic 4.1–4.4) is implemented.
    #
    # Note: Substack newsletters are now fetched via the `substack` section above,
    # which uses the JSON API and is less likely to be blocked by Cloudflare.
    # - name: "Nate's Newsletter"
    #   url: "https://natesnewsletter.substack.com/feed"

    # Paused while focusing on Nate Jones content:
    # - name: "Simon Willison's Weblog"
    #   url: "https://simonwillison.net/atom/everything/"
    # - name: "Lilian Weng (OpenAI)"
    #   url: "https://lilianweng.github.io/index.xml"
