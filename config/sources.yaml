    source_class: practitioner
    enabled: true
    max_videos: 5

  - type: youtube
    name: "Wes Roth"
    channel_id: "UCqcbQf6yw5KzRoDDcZ_wBSw"
    source_class: practitioner
    enabled: true
    max_videos: 3

  - type: youtube
    name: "Matthew Berman"
    channel_id: "UCawZsQWqfGSbCI5yjkdVkTA"
    source_class: practitioner
    enabled: true
