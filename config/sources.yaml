# ---------------------------------------------------------------------------
# digest — email digest settings
#
# Completely independent of the sources section. Filter predicates reference
# only ProcessedItem field names (Schema Contract B), never source names or types.
# ---------------------------------------------------------------------------
digest:
  subject: "Daily AI Digest — {date}"
  send_if_empty: false

  # Filters applied to ProcessedItem records before selecting digest items.
  # All three reference ProcessedItem field names — not source names or types.
  min_credibility: 0.3      # exclude items with credibility_score below this
  max_hype_risk: 0.8        # exclude items with hype_risk above this
  exclude_marketing: true   # exclude items where is_marketing is true

  # Gemini digest generation
  model: "gemini-2.5-flash"
  max_tokens: 2000
  max_items_per_source: 5

  prompt: |
    You are summarising content from AI/ML sources for a senior software engineer
    who follows the LLM space closely. Be concise and technical.

    For each item, write:
    Theme: [1–3 word label, e.g. "agentic RAG", "fine-tuning", "inference cost"]
    Summary: [2–3 sentences: what it is, why it matters, one concrete takeaway]

    Focus on:
    - New model releases and their key capabilities or benchmarks
    - Novel research techniques with practical implications
    - Important open-source releases (libraries, tools, datasets)
    - Significant industry news (funding, partnerships, policy)
    - Practical developer tutorials or insights worth knowing

    Skip:
    - Pure marketing announcements with no technical substance
    - Repetitive coverage of the same story
    - Beginner-level tutorials unless the technique is genuinely new

    After all items, add a ## TL;DR section: exactly 3 bullet points, each a
    single concise sentence naming the most impactful item and why it matters.
    Follow with one "Recurring theme: …" line.

    Finally, add a ## Item Themes section listing each item's URL and its theme
    label, one per line:
    - <url> | <theme label>

    And a ## Item Summaries section:
    - <url> | <summary>

# ---------------------------------------------------------------------------
# pipeline — processing pipeline settings
#
# gemini_model: model used for per-item AI enrichment (stages 3–6).
#   Each model has its own independent free-tier quota pool:
#   gemini-2.0-flash            15 RPM / 1500 RPD — best free-tier throughput
#   gemini-2.5-flash            10 RPM /  500 RPD — stronger reasoning
#   gemini-2.5-flash-lite       30 RPM / 1500 RPD — fastest, lighter capability
#   gemini-3-flash-preview      (check aistudio.google.com for current limits)
#   gemini-3.1-flash-lite-preview (check aistudio.google.com for current limits)
#
#   The pipeline queries ListModels at startup and prunes unavailable entries
#   from the cascade automatically — so preview IDs that haven't rolled out yet
#   are skipped without manual intervention.
#
#   Theme clustering and email digest always use gemini-2.5-flash regardless
#   of this setting (1 call/run; quality matters more than throughput there).
#
# gemini_rpm: minimum interval floor (60 / rpm seconds between calls).
#   The pipeline also adapts dynamically from x-ratelimit-remaining-requests
#   response headers — so this value only governs the fastest we'll ever go,
#   not a ceiling on how slow we'll back off when quota runs low.
#
# enrich_max_output_tokens: Gemini token budget per enrichment call; default 500.
# ---------------------------------------------------------------------------
pipeline:
  gemini_model: "gemini-3-flash-preview"
  gemini_rpm: 15
  enrich_max_output_tokens: 500

# ---------------------------------------------------------------------------
# history — shared global section
# ---------------------------------------------------------------------------
history:
  enabled: true
  history_days: 7
  history_dir: history

# ---------------------------------------------------------------------------
# logging — shared global section
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  log_file: null
