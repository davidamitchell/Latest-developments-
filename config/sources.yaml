      - cs.CL
      - cs.CV
      - cs.RO
    max_papers: 10

  - type: huggingface
    name: "HuggingFace Models"
    source_class: primary
    enabled: true
    max_models: 15
    min_downloads: 1000

  - type: paperswithcode
