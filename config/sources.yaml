    # Wes Roth — closest competitor to Nate Jones for daily frequency.
    # Covers OpenAI, Anthropic, open-source breakthroughs; pro-AGI strategic focus.
    # Channel: https://youtube.com/@WesRoth
    # max_videos: 3 limits token usage during initial ramp-up; increase when comfortable.
    - name: "Wes Roth"
      channel_id: "UCqcbQf6yw5KzRoDDcZ_wBSw"
      max_videos: 3

    # Matthew Berman — go-to for open-source AI and live model testing.
    # Shows how to run bleeding-edge models on local hardware.
    # Channel: https://youtube.com/@matthew_berman
    # - name: "Matthew Berman"
    #   channel_id: "UCawZsQWqfGSbCI5yjkdVkTA"
    #   max_videos: 3

    # The AI Daily Brief (Nathaniel Whittemore) — professional "briefing" style.
    # Daily podcast/video synthesising macro-trends, politics, and funding behind AI.
    # Channel: https://youtube.com/@AIDailyBrief
    # - name: "The AI Daily Brief"
    #   channel_id: "UCKelCK4ZaO6HeEI1KQjqzWA"
