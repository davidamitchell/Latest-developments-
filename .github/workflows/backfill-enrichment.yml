name: Backfill AI Enrichment

# Ops tool: re-enriches ProcessedItems where theme == "" using the Gemini API.
# Run this after any period where GEMINI_API_KEY was absent or quota-exhausted,
# or after the thinking_budget=0 fix (cb6dfe0) to recover items that silently
# stored unenriched due to finish_reason=MAX_TOKENS.
#
# Use max_items (default 50) to chunk large backfills across multiple runs —
# each run commits partial progress so no work is lost on timeout or failure.
#
# After committing enriched data, this workflow triggers rebuild-site.yml
# so the site reflects the latest enrichment state.

on:
  # Manual one-off runs (with full input control).
  workflow_dispatch:
    inputs:
      scope:
        description: "Which files to backfill: 'all' (all dates) or a specific YYYY-MM-DD"
        required: true
        default: "all"
        type: string
      max_items:
        description: "Stop after enriching this many items (0 = unlimited)"
        required: false
        default: "50"
        type: string
      dry_run:
        description: "Dry run — report counts without writing files"
        required: false
        default: "false"
        type: boolean
      debug:
        description: "Enable debug logging"
        required: false
        default: "false"
        type: boolean

  # Called by pipeline.yml after the daily fetch-and-process run so any items
  # that couldn't be enriched (quota exhaustion, transient errors) are retried
  # with whatever quota remains, or in the next day's fresh quota window.
  workflow_call:
    inputs:
      scope:
        description: "Which files to backfill: 'all' (all dates) or a specific YYYY-MM-DD"
        required: false
        default: "all"
        type: string
      max_items:
        description: "Stop after enriching this many items (0 = unlimited)"
        required: false
        default: "20"
        type: string
      dry_run:
        description: "Dry run — report counts without writing files"
        required: false
        default: false
        type: boolean
      debug:
        description: "Enable debug logging"
        required: false
        default: false
        type: boolean

concurrency:
  group: backfill-enrichment
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill unenriched items
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build backfill arguments
        id: args
        run: |
          ARGS=""
          # scope: workflow_dispatch supplies it; workflow_call defaults to "all"
          SCOPE="${{ inputs.scope }}"
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "all" ]; then
            ARGS="$ARGS --all"
          else
            ARGS="$ARGS --date $SCOPE"
          fi
          MAX_ITEMS="${{ inputs.max_items }}"
          if [ -n "$MAX_ITEMS" ] && [ "$MAX_ITEMS" != "0" ]; then
            ARGS="$ARGS --max-items $MAX_ITEMS"
          fi
          # dry_run and debug are only available from workflow_dispatch
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --commit-progress"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run enrichment backfill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.pipeline.backfill ${{ steps.args.outputs.args }}

      - name: Commit any remaining processed data
        if: always() && inputs.dry_run != 'true'
        run: |
          git add data/processed/
          if ! git diff --cached --quiet; then
            git commit -m "chore: backfill AI enrichment for unenriched items [skip ci]"
          fi
          # Always push — picks up per-file commits from --commit-progress even
          # when there are no new uncommitted changes.
          git push origin HEAD

      - name: Trigger site rebuild
        # Only trigger an explicit rebuild for standalone runs (workflow_dispatch).
        # When called from pipeline.yml (workflow_call), rebuild-site.yml fires
        # automatically via its workflow_run trigger on the Pipeline conclusion.
        if: always() && inputs.dry_run != 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebuild-site.yml --ref main
