name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ -q

  validate-youtube-api:
    name: Validate YouTube API Key
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Validate YouTube Data API connectivity
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'EOF'
          import os, sys
          import httpx

          key = os.environ.get("YOUTUBE_API_KEY", "")
          if not key:
              print("SKIP: YOUTUBE_API_KEY secret is not available in this context")
              sys.exit(0)

          # Use the Google Developers YouTube channel as a known-good channel ID
          resp = httpx.get(
              "https://www.googleapis.com/youtube/v3/search",
              params={
                  "part": "snippet",
                  "channelId": "UC295-Dw4tzbMmcArTTnNMcQ",  # Google Developers
                  "type": "video",
                  "order": "date",
                  "maxResults": 1,
                  "key": key,
              },
              timeout=15,
          )
          if resp.status_code == 400:
              print(f"FAIL: API returned 400 — key may be invalid or API not enabled: {resp.text}")
              sys.exit(1)
          if resp.status_code == 403:
              print(f"FAIL: API returned 403 — quota exceeded or key restricted: {resp.text}")
              sys.exit(1)
          resp.raise_for_status()
          items = resp.json().get("items", [])
          print(f"OK: YouTube Data API reachable — {len(items)} result(s) returned")
          EOF
