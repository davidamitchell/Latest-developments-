name: Rebuild Site

# Triggered automatically after the Daily Digest workflow succeeds on main,
# or dispatched manually (e.g. to force a site refresh without a new digest).
#
# Responsibility: read history/ from the repo, run trend analysis to produce
# docs/data/*.json, commit that data, and let GitHub Pages publish docs/.
# This is the ONLY workflow that writes docs/data/.

on:
  workflow_run:
    workflows: ["Daily Digest"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      no_fetch:
        description: "Skip live source fetching — use history only"
        type: boolean
        default: false

jobs:
  rebuild:
    name: Build site data and deploy
    runs-on: ubuntu-latest

    # workflow_run events fire even when the triggering workflow fails.
    # Only proceed when the digest succeeded (or when manually dispatched).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.no_fetch }}" = "true" ]; then
            python -m src.trends --docs docs/data --history history --no-fetch
          else
            python -m src.trends --docs docs/data --history history
          fi

      - name: Commit updated site data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          TODAY=$(date -u +%Y-%m-%d)
          if git diff --cached --quiet; then
            echo "Site data unchanged — nothing to commit"
          else
            git commit -m "chore: rebuild site data ${TODAY} [skip ci]"
            git push origin main
          fi
