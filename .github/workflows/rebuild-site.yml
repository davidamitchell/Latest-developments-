name: Rebuild Site

# Concern: read ProcessedItem records, compute trend analysis, write site data,
# deploy GitHub Pages.
#
# This workflow is a consumer of Schema Contract B (data/processed/).
# It has zero knowledge of fetchers, pipeline stages, or the email digest.
# It does NOT send email and does NOT read history/ for input.
# (history/ is the email digest's concern — this workflow reads data/processed/ directly.)
#
# Triggers:
#   - workflow_run: fires when "Pipeline" or "Fetch and Process" completes on main
#     (immune to [skip ci] which suppresses push-triggered workflows)
#   - workflow_dispatch (standalone manual run)
#
# Deployment: artifact-based via actions/deploy-pages (not commit-to-branch).
# GitHub Pages must be configured to serve from "GitHub Actions" (not branch/docs/).
# Settings → Pages → Source: GitHub Actions

on:
  workflow_run:
    workflows: ["Pipeline", "Fetch and Process"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rebuild:
    name: Build site data and deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site data
        # Reads data/processed/*.jsonl (ProcessedItem records).
        # Computes trend state, credibility aggregates, theme graph.
        # Writes docs/data/*.json for the GitHub Pages site.
        # Implementation: src/site/build.py (W-0028)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.site.build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
