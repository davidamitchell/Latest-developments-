name: Daily Digest

on:
  # Run every day at 07:00 UTC
  schedule:
    - cron: "0 7 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging (--debug)"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Dry run — skip sending email (--dry-run)"
        required: false
        default: "false"
        type: boolean
      max_videos:
        description: "Max videos per channel to check (overrides config; use to catch up on missed content)"
        required: false
        default: ""
        type: string

# Prevent concurrent runs (only one digest at a time)
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Generate and Send Daily Digest
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit state/processed.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
        run: |
          ARGS=""
          if [ "${{ inputs.debug }}" = "true" ]; then
            ARGS="$ARGS --debug"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_videos }}" ]; then
            ARGS="$ARGS --max-videos ${{ inputs.max_videos }}"
          fi
          python -m src.main $ARGS

      - name: Run trend analysis
        # Analyses history/*.txt to produce structured JSON for the GitHub Pages site.
        # Runs even if the digest had no new items; skipped on dry-run.
        if: inputs.dry_run != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.trends --docs docs/data --history history

      - name: Commit updated state, history, and trend data
        # Only runs on non-dry-run executions; state file is only written after a
        # successful email send so it may not exist on first run or when all
        # items were skipped.
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f state/processed.json ] && [ ! -d history ]; then
            echo "No state or history to commit (nothing was processed)"
            exit 0
          fi
          # Stage state file if it exists
          if [ -f state/processed.json ]; then
            git add state/processed.json
          fi
          # Stage history directory if it has any txt files
          if [ -d history ] && find history -maxdepth 1 -name "*.txt" -type f | grep -q .; then
            git add history/
          fi
          # Stage trend data for GitHub Pages site
          if [ -d docs/data ]; then
            git add docs/data/
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if git diff --cached --quiet; then
            echo "State, history, and trend data unchanged — nothing to commit"
          else
            git commit -m "chore: update state, history, and trend data ${TODAY} [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Send failure alert email
        if: failure()
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -m src.emailer \
            --subject "Daily digest FAILED $(date -u +%Y-%m-%d)" \
            --body "Workflow failed. Check: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
